name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Npm install
      run: |
        if [ ! -f "package.json" ] && [ -f "Elbouayachi-vpn-source/package.json" ]; then
          cd Elbouayachi-vpn-source
        fi
        rm -rf node_modules package-lock.json
        npm install --force --no-audit --no-fund --ignore-scripts
        npm install --force --no-audit --no-fund --ignore-scripts @capacitor/cli @capacitor/core @capacitor/android

    - name: Build web app
      run: |
        if [ ! -f "package.json" ] && [ -f "Elbouayachi-vpn-source/package.json" ]; then
          cd Elbouayachi-vpn-source
        fi
        npm run build --if-present

    - name: Capacitor sync
      run: |
        if [ ! -f "package.json" ] && [ -f "Elbouayachi-vpn-source/package.json" ]; then
          cd Elbouayachi-vpn-source
        fi
        if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
          echo '{"appId":"com.elbouayachi.vpn","appName":"Elbouayachi VPN","webDir":"dist"}' > capacitor.config.json

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Npm install
      run: |
        if [ ! -f "package.json" ] && [ -f "Elbouayachi-vpn-source/package.json" ]; then
          cd Elbouayachi-vpn-source
        fi
        pwd
        ls
        rm -rf node_modules package-lock.json
        npm install --force --no-audit --no-fund --ignore-scripts

    - name: Install Capacitor
      run: |
        if [ ! -f "package.json" ] && [ -f "Elbouayachi-vpn-source/package.json" ]; then
          cd Elbouayachi-vpn-source
        fi
        npm install --force --no-audit --no-fund --ignore-scripts @capacitor/cli @capacitor/core @capacitor/android

    - name: Build web app
      run: |
        if [ ! -f "package.json" ] && [ -f "Elbouayachi-vpn-source/package.json" ]; then
          cd Elbouayachi-vpn-source
        fi
        npm run build --if-present
        ls

    - name: Capacitor sync
      run: |
        if [ ! -f "package.json" ] && [ -f "Elbouayachi-vpn-source/package.json" ]; then
          cd Elbouayachi-vpn-source
        fi
        npx cap sync android

    - name: Setup Android SDK Environment
      run: |
        mkdir -p "$HOME/android-sdk/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandlinetools.zip
        unzip -q commandlinetools.zip -d "$HOME/android-sdk/cmdline-tools"
        mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
        export ANDROID_SDK_ROOT="$HOME/android-sdk"
        export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools"

        yes | sdkmanager --licenses > /dev/null
        sdkmanager "platform-tools" "platforms;android-33" "platforms;android-34" "build-tools;33.0.0" "build-tools;34.0.0"

    - name: Build APK with Gradle
      run: |
        export ANDROID_SDK_ROOT="$HOME/android-sdk"

        if [ -d "android" ]; then
          cd android
        elif [ -d "Elbouayachi-vpn-source/android" ]; then
          cd Elbouayachi-vpn-source/android
        fi

        sed -i '/aapt2FromMavenOverride/d' gradle.properties

        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/**/*.apk'

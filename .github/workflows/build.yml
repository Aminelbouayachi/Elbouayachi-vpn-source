name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Android SDK Environment
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandlinetools.zip
        unzip -q commandlinetools.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
        
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

    - name: Install dependencies & sync Capacitor
      run: |
        if [ -f "package.json" ]; then
          npm cache clean --force
          npm install || npm install --legacy-peer-deps
          npx cap sync android || true
        fi

    - name: Build APK with Gradle
      run: |
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        
        PROJECT_DIR=$(find . -name "build.gradle" -maxdepth 3 | xargs dirname | head -n 1)
        
        if [ -n "$PROJECT_DIR" ]; then
          echo "Found Gradle project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
        fi
        
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleRelease
        else
          gradle assembleRelease
        fi

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies and sync Capacitor
      run: |
        if [ -f "package.json" ]; then
          :
        elif [ -f "Elbouayachi-vpn-source/package.json" ]; then
          cd Elbouayachi-vpn-source
        fi
        rm -rf node_modules package-lock.json
        npm install --legacy-
